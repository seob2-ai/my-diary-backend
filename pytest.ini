[pytest]
# pytest 설정 파일
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=reports/report.html
    --self-contained-html
    --cov=app
    --cov-report=html:reports/coverage
    --cov-report=term-missing
markers =
    unit: 단위 테스트
    integration: 통합 테스트
    api: API 테스트
    slow: 느린 테스트

